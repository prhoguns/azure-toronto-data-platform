name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Bicep
        run: |
          az bicep install
          az bicep build -f infra/main.bicep --stdout > /dev/null
          az bicep lint -f infra/main.bicep
      - name: Validate ADF JSON
        run: for f in adf/*/*.json adf/*.json; do jq empty "$f"; done
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: Format, validate and test (mocked Azure provider)
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
          terraform test
      - name: Checkov
        run: |
          docker run --rm -v "$PWD/infra/terraform:/src" -w /src bridgecrew/checkov:3.3.26 \
            -d . --framework terraform --skip-path .terraform --compact --quiet
  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12"}  # the Databricks Runtime 17 Python
      - run: pip install pyspark==4.0.4 openpyxl==3.1.5
      - name: Fetch the real source files
        run: |
          mkdir raw
          curl -sL -o raw/major_crime_indicators.csv "https://ckan0.cf.opendata.inter.prod-toronto.ca/dataset/6909ea60-ef0e-465f-b5d0-43106b6b9130/resource/8084057c-b2da-486c-b517-38f4e314b820/download/major-crime-indicators.csv"
          curl -sL -o raw/neighbourhoods.csv "https://ckan0.cf.opendata.inter.prod-toronto.ca/dataset/fc443770-ef0a-4025-9c2c-2cb558bfab00/resource/7f7dc9c5-42bb-446e-ad79-dd4dd792c9db/download/neighbourhoods-4326.csv"
          python tests/make_profiles_long.py raw/neighbourhood_profiles.csv
      - name: Run notebooks on local Spark
        run: python tests/run_local.py raw/major_crime_indicators.csv raw/neighbourhoods.csv raw/neighbourhood_profiles.csv
